[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "matrix-mcp"
dynamic = ["version"]
description = "A cut-down, hardened fork of matrix-mcp: read Matrix rooms; write only text, replies, reactions, edits and read markers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MindRoom" }]
keywords = [
  "agents",
  "ai",
  "claude",
  "codex",
  "matrix",
  "mcp",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "certifi>=2024.2.2",
  "fastmcp>=3.4.10,<4",
  "httpx>=0.28",
  "platformdirs>=4.3",
  "pydantic>=2.11",
  "typer>=0.19",
]

[project.urls]
Repository = "https://github.com/srujanmalakpata/matrix-mcp"
Upstream = "https://github.com/mindroom-ai/matrix-mcp"

[project.optional-dependencies]
dev = [
  "aiohttp>=3.14",  # test servers only
  "mypy>=1.14",
  "pre-commit>=4",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.13",
  "ty",
]

[project.scripts]
matrix-mcp = "matrix_mcp.cli:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/matrix_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",       # pydocstyle
  "ANN",     # annotations
  "COM812",  # trailing comma
  "CPY001",  # no per-file copyright headers; see LICENSE
  "ISC001",  # implicit string concat
  "T20",     # print statements are acceptable for CLI output
  "PLR0917", # PLR0913 already bounds argument counts, with targeted exceptions
]

[tool.ruff.lint.per-file-ignores]
"src/matrix_mcp/cli.py" = [
  "B008",    # Typer uses Option/Argument defaults intentionally
  "FBT001",  # Typer boolean options are command-line flags
  "FBT003",  # Typer boolean option defaults are command-line flag defaults
  "PLC0415", # command handlers intentionally lazy-import runtime dependencies
  "PLR0913", # CLI commands naturally expose several command-line options
  "TC003",   # Typer resolves annotations at runtime
]
"src/matrix_mcp/config.py" = [
  "S105", # redaction placeholder is intentionally not a real token
]
"src/matrix_mcp/mcp_server.py" = [
  "PLR0913", # MCP tool signatures expose structured tool parameters directly
]
".github/scripts/*" = [
  "INP001", # standalone CI scripts, not a package
]
"tests/*" = [
  "S101",    # assert usage is fine in tests
  "PLR2004", # magic values are fine in tests
  "S105",    # test tokens
  "S106",    # test tokens
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["matrix_mcp"]

[tool.ty.rules]
unused-ignore-comment = "ignore"
